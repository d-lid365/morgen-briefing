<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="theme-color" content="#f6f3ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14161a" media="(prefers-color-scheme: dark)">
<title>Morgen-Briefing</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-row">
    <div>
      <h1 id="viewTitle">Briefing</h1>
      <div class="stamp" id="stamp">Lädt …</div>
    </div>
    <button class="refresh" id="refreshBtn" aria-label="Aktualisieren">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.34-5.66M20 4v5h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
  <div class="progress" id="progress" hidden><div></div><span id="progressText"></span></div>
</header>

<main id="main"></main>

<nav class="tabbar" id="tabbar">
  <button data-view="briefing" class="on"><svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="4.5"/><path d="M12 3v2.5M4.6 6.6l1.8 1.8M19.4 6.6l-1.8 1.8M2.5 18h19"/></svg><span>Briefing</span></button>
  <button data-view="news"><svg viewBox="0 0 24 24"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7 8.5h10M7 12h10M7 15.5h6"/></svg><span>Nachrichten</span></button>
  <button data-view="markets"><svg viewBox="0 0 24 24"><path d="M3.5 19.5h17M5 15l4.5-4.5 3.5 3 6-6.5"/></svg><span>Märkte</span></button>
  <button data-view="saved"><svg viewBox="0 0 24 24"><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z"/></svg><span>Merkliste</span></button>
  <button data-view="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.4M12 18.8v2.4M2.8 12h2.4M18.8 12h2.4M5.5 5.5l1.7 1.7M16.8 16.8l1.7 1.7M5.5 18.5l1.7-1.7M16.8 7.2l1.7-1.7"/></svg><span>Mehr</span></button>
</nav>

<div class="toast" id="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
