name: Briefing aktualisieren

on:
  schedule:
    - cron: "7,37 3-21 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Nachrichten und Marktdaten holen, auswerten
        env:
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          PREV_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          mkdir -p _site
          cp -r site/* _site/
          python3 scripts/update.py --out _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4

      - name: Zeitplan aktiv halten
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45*24*3600 )) ]; then
            date -u > .github/keepalive.txt
            git config user.name "briefing-bot"
            git config user.email "briefing-bot@users.noreply.github.com"
            git add .github/keepalive.txt
            git commit -m "Zeitplan aktiv halten [skip ci]"
            git push
          fi
